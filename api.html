<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background-color: #f0f4ff;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  .menu {
    background-color: darkblue;
    padding: 12px;
  }
  .menu a {
    color: white;
    margin: 0 12px;
    text-decoration: none;
    font-size: 18px;
  }
  h1 {
    color: darkblue;
  }
  button {
    background-color: darkblue;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
  }
  input {
    padding: 10px;
    font-size: 16px;
    width: 220px;
    margin: 10px;
  }
  #status {
    color: green;
    font-size: 18px;
    margin: 15px;
  }
  .card {
    background-color: white;
    margin: 10px auto;
    padding: 12px;
    width: 300px;
    border-radius: 8px;
    text-align: left;
  }
  .card h3 {
    margin: 0 0 5px 0;
    color: darkblue;
  }
  .card p {
    margin: 3px 0;
  }
  @media (max-width: 600px) {
    .menu a {
      font-size: 14px;
      margin: 0 6px;
    }
    h1 {
      font-size: 24px;
    }
    .card {
      width: 80%;
    }
  }
</style>
</head>
<body>
<div class="menu">
  <a href="index.html">Home</a>
  <a href="todo.html">To-Do</a>
  <a href="calculator.html">Calculator</a>
  <a href="quiz.html">Quiz</a>
</div>
<h1>Users from an API</h1>
<button onclick="loadUsers()">Load users</button>
<br>
<input id="searchBox" placeholder="Search by name or city" oninput="showUsers()">
<p id="status"></p>
<div id="users"></div>

<script>
  var allUsers = [];

  async function loadUsers() {
    var status = document.getElementById("status");
    status.innerText = "Loading...";
    document.getElementById("users").innerHTML = "";

    try {
      var response = await fetch("https://jsonplaceholder.typicode.com/users");
      allUsers = await response.json();
      showUsers();
    } catch (error) {
      status.innerText = "Something went wrong. Check your internet.";
    }
  }

  function showUsers() {
    var search = document.getElementById("searchBox").value.toLowerCase();
    var box = document.getElementById("users");
    var status = document.getElementById("status");
    box.innerHTML = "";

    var matches = allUsers.filter(function(user) {
      return user.name.toLowerCase().includes(search) ||
             user.address.city.toLowerCase().includes(search);
    });

    for (var i = 0; i < matches.length; i++) {
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        "<h3>" + matches[i].name + "</h3>" +
        "<p>Email: " + matches[i].email + "</p>" +
        "<p>City: " + matches[i].address.city + "</p>" +
        "<p>Company: " + matches[i].company.name + "</p>";
      box.appendChild(card);
    }

    if (allUsers.length > 0) {
      status.innerText = "Showing " + matches.length + " of " + allUsers.length + " users";
    }
  }
</script>
</body>
</html>
