<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background-color: #f0f4ff;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
  }
  .menu {
    background-color: darkblue;
    padding: 12px;
  }
  .menu a {
    color: white;
    margin: 0 12px;
    text-decoration: none;
    font-size: 18px;
  }
  h1 {
    color: darkblue;
  }
  .box {
    background-color: white;
    max-width: 340px;
    margin: 0 auto;
    padding: 20px;
    border-radius: 10px;
    text-align: left;
  }
  label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
    color: darkblue;
  }
  input, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 10px;
    font-size: 16px;
    margin-top: 5px;
    font-family: Arial, sans-serif;
  }
  textarea {
    height: 100px;
  }
  .error {
    color: red;
    font-size: 14px;
    min-height: 18px;
  }
  button {
    background-color: darkblue;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    margin-top: 15px;
  }
  #success {
    color: green;
    font-size: 18px;
    margin: 20px;
  }
  @media (max-width: 600px) {
    .menu a {
      font-size: 14px;
      margin: 0 6px;
    }
    h1 {
      font-size: 24px;
    }
    .box {
      margin: 0 15px;
    }
  }
</style>
</head>
<body>
<div class="menu">
  <a href="index.html">Home</a>
  <a href="todo.html">To-Do</a>
  <a href="calculator.html">Calculator</a>
  <a href="quiz.html">Quiz</a>
</div>
<h1>Contact Me</h1>

<div class="box">
  <label>Name</label>
  <input id="name" placeholder="Your name">
  <div class="error" id="nameError"></div>

  <label>Email</label>
  <input id="email" placeholder="you@example.com">
  <div class="error" id="emailError"></div>

  <label>Message</label>
  <textarea id="message" placeholder="Write at least 10 characters"></textarea>
  <div class="error" id="messageError"></div>

  <button onclick="checkForm()">Send</button>
</div>

<p id="success"></p>

<script>
  function checkForm() {
    var name = document.getElementById("name").value.trim();
    var email = document.getElementById("email").value.trim();
    var message = document.getElementById("message").value.trim();
    var valid = true;

    document.getElementById("nameError").innerText = "";
    document.getElementById("emailError").innerText = "";
    document.getElementById("messageError").innerText = "";
    document.getElementById("success").innerText = "";

    if (name === "") {
      document.getElementById("nameError").innerText = "Please enter your name.";
      valid = false;
    }

    if (email === "") {
      document.getElementById("emailError").innerText = "Please enter your email.";
      valid = false;
    } else if (!email.includes("@") || !email.includes(".")) {
      document.getElementById("emailError").innerText = "Please enter a valid email.";
      valid = false;
    }

    if (message.length < 10) {
      document.getElementById("messageError").innerText = "Message must be at least 10 characters.";
      valid = false;
    }

    if (valid) {
      document.getElementById("success").innerText = "Thank you, " + name + "! Your message looks good.";
      document.getElementById("name").value = "";
      document.getElementById("email").value = "";
      document.getElementById("message").value = "";
    }
  }
</script>
</body>
</html>
