<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background-color: #f0f4ff;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  .menu {
    background-color: darkblue;
    padding: 12px;
  }
  .menu a {
    color: white;
    margin: 0 12px;
    text-decoration: none;
    font-size: 18px;
  }
  h1 {
    color: darkblue;
  }
  input {
    padding: 10px;
    font-size: 16px;
    width: 220px;
    margin: 10px;
  }
  .status {
    color: green;
    font-size: 18px;
    margin: 15px;
  }
  .card {
    background-color: white;
    margin: 10px auto;
    padding: 12px;
    width: 300px;
    border-radius: 8px;
    text-align: left;
  }
  .card h3 {
    margin: 0 0 5px 0;
    color: darkblue;
  }
  .card p {
    margin: 3px 0;
  }
  @media (max-width: 600px) {
    .menu a {
      font-size: 14px;
      margin: 0 6px;
    }
    h1 {
      font-size: 24px;
    }
    .card {
      width: 80%;
    }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
</head>
<body>
<div class="menu">
  <a href="index.html">Home</a>
  <a href="todo.html">To-Do</a>
  <a href="calculator.html">Calculator</a>
  <a href="quiz.html">Quiz</a>
</div>
<h1>React User Directory</h1>
<div id="root"></div>

<script type="text/babel">
  function UserCard(props) {
    const user = props.user;
    return (
      <div className="card">
        <h3>{user.name}</h3>
        <p>Email: {user.email}</p>
        <p>City: {user.address.city}</p>
        <p>Company: {user.company.name}</p>
      </div>
    );
  }

  function UserApp() {
    const [users, setUsers] = React.useState([]);
    const [search, setSearch] = React.useState("");
    const [error, setError] = React.useState("");
    const [loading, setLoading] = React.useState(true);

    React.useEffect(() => {
      async function loadUsers() {
        try {
          const response = await fetch("https://jsonplaceholder.typicode.com/users");
          const data = await response.json();
          setUsers(data);
        } catch (err) {
          setError("Something went wrong. Check your internet.");
        }
        setLoading(false);
      }
      loadUsers();
    }, []);

    const text = search.toLowerCase();
    const matches = users.filter((user) =>
      user.name.toLowerCase().includes(text) ||
      user.address.city.toLowerCase().includes(text)
    );

    let message = "";
    if (loading) {
      message = "Loading...";
    } else if (error) {
      message = error;
    } else {
      message = "Showing " + matches.length + " of " + users.length + " users";
    }

    return (
      <div>
        <input
          value={search}
          placeholder="Search by name or city"
          onChange={(e) => setSearch(e.target.value)}
        />
        <p className="status">{message}</p>
        {matches.map((user) => (
          <UserCard key={user.id} user={user} />
        ))}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<UserApp />);
</script>
</body>
</html>
