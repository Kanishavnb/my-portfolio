<html>
<head>
<style>
  body {
    background-color: #f0f4ff;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  .menu {
    background-color: darkblue;
    padding: 12px;
  }
  .menu a {
    color: white;
    margin: 0 12px;
    text-decoration: none;
    font-size: 18px;
  }
  h1 {
    color: darkblue;
  }
  input {
    padding: 10px;
    font-size: 16px;
    width: 100px;
    margin: 5px;
  }
  button {
    background-color: darkblue;
    color: white;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    margin: 5px;
  }
  #result {
    font-size: 24px;
    color: green;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="menu">
  <a href="index.html">Home</a>
  <a href="todo.html">To-Do</a>
  <a href="calculator.html">Calculator</a>
  <a href="quiz.html">Quiz</a>
</div>
<h1>My Calculator</h1>
<input id="num1" type="number" placeholder="Number 1">
<input id="num2" type="number" placeholder="Number 2">
<br>
<button onclick="calculate('+')">+</button>
<button onclick="calculate('-')">-</button>
<button onclick="calculate('*')">×</button>
<button onclick="calculate('/')">÷</button>
<p id="result"></p>

<script>
  function calculate(op) {
    var a = Number(document.getElementById("num1").value);
    var b = Number(document.getElementById("num2").value);
    var answer;
    if (op === "+") { answer = a + b; }
    if (op === "-") { answer = a - b; }
    if (op === "*") { answer = a * b; }
    if (op === "/") {
      if (b === 0) {
        document.getElementById("result").innerText = "Cannot divide by zero";
        return;
      }
      answer = a / b;
    }
    document.getElementById("result").innerText = "Answer: " + answer;
  }
</script>
</body>
</html>
